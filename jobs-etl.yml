name: jobs-etl

on:
  schedule:
    - cron: '20 6 * * *'        # раз в сутки, 06:20 UTC (Remotive просит не частить)
  workflow_dispatch: {}         # ручной запуск из вкладки Actions
  push:
    paths: ['jobs_etl.py', 'tests/**', 'requirements.txt']   # тесты при изменении кода

concurrency:
  group: jobs-etl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  etl:
    needs: test                                  # данные грузим, только если тесты прошли
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: Run jobs ETL
        run: python jobs_etl.py run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}   # ключ service_role, только в Secrets
