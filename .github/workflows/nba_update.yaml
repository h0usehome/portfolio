name: Update NBA Dashboard

on:
  schedule:
    # Запуск каждый день в 09:00 по UTC (12:00 по Москве)
    - cron: '0 9 * * *'
  workflow_dispatch: # Кнопка для ручного запуска

jobs:
  update-data:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Здесь добавлена библиотека lxml, которую требует pandas в nba_etl.py, а также curl_cffi
          pip install requests supabase pandas bs4 lxml curl_cffi python-dotenv

      - name: Run NBA ETL (Yesterday's Games & News)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # Универсальное вычисление даты через Python (работает на Mac, Linux и Windows)
          YESTERDAY=$(python3 -c "from datetime import date, timedelta; print(date.today() - timedelta(days=1))")
          echo "Updating games for date: $YESTERDAY"
          
          # Запускаем скрипт
          python3 nba_etl.py games --date $YESTERDAY
          python3 nba_etl.py news