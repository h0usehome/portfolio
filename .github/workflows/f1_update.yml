name: Update F1 Dashboard

on:
  schedule:
    # Запуск каждый понедельник в 06:00 по UTC (09:00 по Москве)
    - cron: '0 6 * * 1'
  workflow_dispatch: # Позволяет запускать скрипт вручную по кнопке

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase

      - name: Run F1 ETL (Latest Race & News)
        env:
          # Если твой nba_etl.py берет ключи из переменных окружения, они прокидываются здесь.
          # Значения нужно добавить в настройки репозитория: Settings -> Secrets and variables -> Actions
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python3 f1_etl_2.py last
          python3 f1_etl_2.py news